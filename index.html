<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pancing HP</title>
<style>
:root{--bg:#0e2a33;--fg:#eaf3ee;--ac:#f2a541;--w:#14505f}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px Georgia,serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:12px;box-sizing:border-box}
h2{margin:0;font-size:28px}
button{font:inherit;font-weight:700;padding:16px 30px;border:0;border-radius:10px;background:var(--ac);color:#1a1205}
canvas{width:100%;max-width:880px;background:var(--w);border-radius:10px}
#qr{background:#fff;padding:10px;display:inline-block;border-radius:6px}
#url{font-size:11px;word-break:break-all;max-width:340px;opacity:.7}
.hide{display:none}
</style></head><body>
<div id="host" class="hide">
 <div id="panel">
  <h2>Pancing HP</h2>
  <p>Scan dengan HP untuk jadi joran:</p>
  <div id="qr"></div>
  <p id="url"></p>
  <p>Tes tanpa HP: Spasi = hentak, tahan R = menggulung, panah kiri/kanan = arah</p>
 </div>
 <canvas id="cv" width="800" height="450"></canvas>
</div>
<div id="ctl" class="hide">
 <h2>Joran</h2>
 <button id="go">Mulai dan izinkan sensor</button>
</div>
<p id="st"></p>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id), log=m=>$('st').textContent=m;
const cid=new URLSearchParams(location.search).get('c');
function beep(f,d){try{const c=beep.c||(beep.c=new(window.AudioContext||webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.1;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
cid?controller():host();

function controller(){
 $('ctl').classList.remove('hide');
 let conn,last=0,s={g:0,b:0};
 $('go').onclick=async()=>{
  try{const D=window.DeviceMotionEvent;if(D&&D.requestPermission&&await D.requestPermission()!=='granted')return log('Izin sensor ditolak')}catch(e){return log('Izin gagal: '+e)}
  beep(1,.01);log('Menghubungkan...');
  const p=new Peer();
  p.on('error',e=>log('Error: '+e.type));
  p.on('open',()=>{
   conn=p.connect(cid,{reliable:false});
   conn.on('open',()=>{$('go').classList.add('hide');log('Terhubung. Pegang HP seperti joran.');run()});
   conn.on('close',()=>log('Terputus'));
   conn.on('data',d=>{
    if(d.t==='bite'){navigator.vibrate&&navigator.vibrate([200,80,200]);beep(880,.25)}
    if(d.t==='msg')log(d.m);
   });
  });
 };
 function run(){
  addEventListener('deviceorientation',e=>{s.g=e.gamma||0;s.b=e.beta||0});
  addEventListener('devicemotion',e=>{
   const n=performance.now();if(n-last<33||!conn.open)return;last=n;
   const a=e.acceleration,ag=e.accelerationIncludingGravity,r=e.rotationRate||{};
   const acc=a&&a.x!=null?Math.hypot(a.x,a.y,a.z):(ag?Math.abs(Math.hypot(ag.x,ag.y,ag.z)-9.8):0);
   conn.send({a:acc,r:Math.hypot(r.alpha||0,r.beta||0,r.gamma||0),g:s.g});
  });
 }
}

function host(){
 $('host').classList.remove('hide');
 const id='pancing-'+Math.random().toString(36).slice(2,7);
 const url=location.href.split('?')[0]+'?c='+id;
 let conn=null,inp={a:0,r:0,g:0};
 try{
  const p=new Peer(id);
  p.on('open',()=>{new QRCode($('qr'),{text:url,width:180,height:180});$('url').textContent=url});
  p.on('error',e=>log('Koneksi HP tidak tersedia ('+e.type+'). Mode keyboard tetap jalan.'));
  p.on('connection',c=>{conn=c;c.on('data',d=>inp=d);$('panel').classList.add('hide');log('HP terhubung');say(msg)});
 }catch(e){log('PeerJS gagal dimuat. Mode keyboard tetap jalan.')}

 const key={sp:false,r:false};let kx=0;
 addEventListener('keydown',e=>{
  if(e.key===' '){key.sp=true;e.preventDefault()}
  if(e.key==='r')key.r=true;
  if(e.key==='ArrowLeft')kx=Math.max(-.4,kx-.05);
  if(e.key==='ArrowRight')kx=Math.min(.4,kx+.05);
  $('panel').classList.add('hide');
 });
 addEventListener('keyup',e=>{if(e.key===' ')key.sp=false;if(e.key==='r')key.r=false});

 const cv=$('cv'),x=cv.getContext('2d');
 let S='idle',t=0,cool=0,fish=1,tens=0,score=0,bx=.5,biteAt=3,prevHit=false,msg='Hentak HP ke depan untuk melempar';
 function say(m){msg=m;if(conn&&conn.open)conn.send({t:'msg',m})}
 function go(s,m){S=s;t=0;cool=.7;say(m)}

 function step(dt){
  const hit=inp.a>14||key.sp,edge=hit&&!prevHit&&cool<=0;prevHit=hit;
  const rot=Math.max(inp.r||0,key.r?400:0);
  cool-=dt;
  if(S==='idle'){
   if(edge){bx=Math.min(.9,Math.max(.1,.5+(inp.g||0)/90+kx));biteAt=2+Math.random()*4;go('wait','Menunggu ikan...')}
  }else if(S==='wait'){
   t+=dt;
   if(t>biteAt){go('bite','Ikan makan! Hentak sekarang!');beep(880,.25);if(conn&&conn.open)conn.send({t:'bite'})}
  }else if(S==='bite'){
   t+=dt;
   if(edge){fish=1;tens=0;go('reel','Putar HP seperti menggulung')}
   else if(t>1.5)go('idle','Ikan lolos. Hentak untuk melempar lagi')
  }else if(S==='reel'){
   t+=dt;
   const fight=Math.sin(t*1.7)>.55;
   fish-=rot/3000*dt;fish+=(fight?.05:.015)*dt;
   tens+=(fight&&rot>250?.8:-.4)*dt;tens=Math.min(1,Math.max(0,tens));
   fish=Math.min(1,fish);
   if(tens>=1){go('idle','Tali putus. Pelan saat ikan melawan')}
   else if(fish<=0){score++;beep(1200,.3);go('idle','Dapat ikan! Hentak untuk melempar lagi')}
  }
 }

 function draw(){
  x.fillStyle='#9fd0d8';x.fillRect(0,0,800,150);
  x.fillStyle='#14505f';x.fillRect(0,150,800,300);
  x.fillStyle='#1b6a7c';for(let i=0;i<6;i++)x.fillRect(40+i*140,200+(i%3)*60,70,3);
  const k=S==='reel'?1-fish:S==='idle'?1:0;
  let px=S==='idle'?400:bx*800+(400-bx*800)*k, py=S==='idle'?420:260+k*130;
  if(S==='wait'||S==='bite')py+=Math.sin(performance.now()/300)*(S==='bite'?10:3);
  x.strokeStyle='#eaf3ee';x.lineWidth=2;x.beginPath();x.moveTo(400,440);x.lineTo(px,py);x.stroke();
  x.fillStyle=S==='bite'?'#e63946':'#f2a541';x.beginPath();x.arc(px,py,9,0,7);x.fill();
  if(S==='bite'){x.strokeStyle='#fff';x.beginPath();x.arc(px,py,20+(t*60)%30,0,7);x.stroke()}
  x.fillStyle='#eaf3ee';x.font='22px Georgia';x.textAlign='center';x.fillText(msg,400,40);
  x.textAlign='left';x.font='18px Georgia';x.fillText('Ikan: '+score,16,440);
  if(S==='reel'){
   x.fillStyle='#0003';x.fillRect(600,420,180,16);
   x.fillStyle=tens>.7?'#e63946':'#f2a541';x.fillRect(600,420,180*tens,16);
   x.fillStyle='#eaf3ee';x.fillText('Tegangan tali',600,412);
   if(Math.sin(t*1.7)>.55){x.fillStyle='#e63946';x.textAlign='center';x.fillText('Ikan melawan, gulung pelan',400,70)}
  }
 }
 let lt=performance.now();
 (function loop(n){const dt=Math.min(.05,(n-lt)/1000);lt=n;step(dt);draw();requestAnimationFrame(loop)})(lt);
}
</script>
</body></html>
