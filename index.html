<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Sinkron HP & Laptop</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 20px; background: #111; color: #fff; }
  #qr { background: #fff; padding: 10px; display: inline-block; margin: 15px auto; border-radius: 8px; }
  .box { background: #222; border: 2px solid #444; padding: 15px; margin: 10px auto; max-width: 400px; border-radius: 8px; }
  button { padding: 15px 25px; font-size: 18px; font-weight: bold; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; }
  .active { background: #e63946 !important; }
</style>
</head>
<body>

<h2>TES SINKRONISASI HP <-> LAPTOP</h2>

<!-- Halaman Laptop -->
<div id="view-host" class="box" style="display:none;">
  <h3>Layar Laptop (Host)</h3>
  <p id="host-status">Mempersiapkan ID...</p>
  <div id="qr"></div>
  <hr>
  <h4>Data Diterima dari HP:</h4>
  <h1 id="host-data" style="color: #f2a541;">Belum ada data</h1>
</div>

<!-- Halaman HP -->
<div id="view-ctl" class="box" style="display:none;">
  <h3>Layar HP (Controller)</h3>
  <p id="ctl-status">Klik tombol di bawah untuk terhubung:</p>
  <button id="btn-connect">HUBUNGKAN KE LAPTOP</button>
  <hr>
  <h4>Status Sensor HP:</h4>
  <p id="ctl-motion">Goyangkan HP setelah terhubung!</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const roomId = new URLSearchParams(location.search).get('room');

// Jika tidak ada parameter ?room= di URL, berarti ini LAPTOP
if (!roomId) {
  initLaptop();
} else {
  initHP();
}

// -------------------------------------------------------------
// 1. LOGIKA LAPTOP
// -------------------------------------------------------------
function initLaptop() {
  $('view-host').style.display = 'block';$('host-status').textContent = 'Meminta ID dari server PeerJS...';

  // Pakai server PeerJS resmi versi stabil
  const peer = new Peer();

  peer.on('open', id => {
    $('host-status').textContent = 'SIAP! Scan QR Code ini di HP:';
    const ctlUrl = window.location.href.split('?')[0] + '?room=' + id;
    
    $('qr').innerHTML = '';
    new QRCode($('qr'), { text: ctlUrl, width: 200, height: 200 });
  });

  peer.on('connection', conn => {
    $('host-status').textContent = 'TERHUBUNG DENGAN HP!';
    
    conn.on('data', data => {
      // Tampilkan data langsung di layar Laptop
      $('host-data').textContent = `Acc: ${data.acc} | Status: ${data.msg}`;
      document.body.style.backgroundColor = data.hit ? '#800' : '#111';
    });
  });

  peer.on('error', err => {
    $('host-status').textContent = 'Error Laptop: ' + err.type;
  });
}

// -------------------------------------------------------------
// 2. LOGIKA HP
// -------------------------------------------------------------
function initHP() {
  $('view-ctl').style.display = 'block';
  let conn = null;

  $('btn-connect').onclick = async () => {$('ctl-status').textContent = 'Meminta izin sensor & menghubungkan...';

    // Minta izin sensor iOS/Android
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        await DeviceMotionEvent.requestPermission();
      }
    } catch(e) {}

    const peer = new Peer();

    peer.on('open', () => {
      // Hubungkan ke ID Laptop yang ada di URL
      conn = peer.connect(roomId);

      conn.on('open', () => {
        $('ctl-status').textContent = 'SINKRON BERHASIL! Goyangkan HP-mu!';
        $('btn-connect').style.display = 'none';
        
        // Mulai kirim data sensor saat HP digoyangkan
        window.addEventListener('devicemotion', e => {
          const a = e.accelerationIncludingGravity || e.acceleration;
          if (!a) return;

          const acc = Math.hypot(a.x || 0, a.y || 0, a.z || 0).toFixed(1);
          const isHit = acc > 15; // Hentakan kuat

          $('ctl-motion').textContent = `Angka Gerak: ${acc}`;

          // Kirim langsung ke Laptop
          conn.send({
            acc: acc,
            hit: isHit,
            msg: isHit ? 'HENTAKAN DITANGKAP!' : 'Gerak Biasa'
          });
        });
      });

      conn.on('error', err => {
        $('ctl-status').textContent = 'Gagal Konek: ' + err.type;
      });
    });
  };
}
</script>
</body>
</html>
